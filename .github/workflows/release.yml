name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build signed APK & publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v5

      - name: Check tag matches versionName
        run: |
          version=$(sed -nE 's/^\s*versionName = "([^"]+)"/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew :engine:test :storage:test --console=plain

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DRAWSPACE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::DRAWSPACE_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "DRAWSPACE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          DRAWSPACE_KEYSTORE_PASSWORD: ${{ secrets.DRAWSPACE_KEYSTORE_PASSWORD }}
          DRAWSPACE_KEY_ALIAS: ${{ secrets.DRAWSPACE_KEY_ALIAS }}
          DRAWSPACE_KEY_PASSWORD: ${{ secrets.DRAWSPACE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Verify signature & stage assets
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/drawspace-$GITHUB_REF_NAME.apk"
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then
            notes_args=(--notes-file "$notes")
          else
            notes_args=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Drawspace $GITHUB_REF_NAME" \
            "${notes_args[@]}"
